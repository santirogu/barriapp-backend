# Pre-commit hooks — shift-left quality gates (see docs/TEST_STRATEGY.md §6).
# Install once:  uv run pre-commit install
minimum_pre_commit_version: "4.0.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: mypy
        name: mypy (app)
        entry: uv run mypy app
        language: system
        types: [python]
        pass_filenames: false
      - id: bandit
        name: bandit (SAST)
        entry: uv run bandit -r app -c pyproject.toml
        language: system
        types: [python]
        pass_filenames: false
