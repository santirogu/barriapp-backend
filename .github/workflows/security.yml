name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, Mondays 06:00 UTC

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

# Required to publish results to the GitHub Security > Code scanning tab.
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  sast-sca:
    name: SAST & dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      # --- Bandit (Python SAST): SARIF for Code Scanning, then a blocking gate ---
      - name: Bandit (SARIF)
        run: uv run bandit -r app -c pyproject.toml -f sarif -o bandit.sarif
        continue-on-error: true

      - name: Upload Bandit SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif
          category: bandit

      - name: Bandit (gate)
        run: uv run bandit -r app -c pyproject.toml

      # --- Dependency vulnerabilities (reporting) ---
      - name: pip-audit
        run: uv run pip-audit
        continue-on-error: true

      # --- Semgrep (SAST): SARIF for Code Scanning (reporting) ---
      - name: Semgrep (SARIF)
        run: uvx semgrep scan --config p/python --config p/security-audit --sarif --output semgrep.sarif
        continue-on-error: true

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
