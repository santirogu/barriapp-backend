name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, Mondays 06:00 UTC

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast-sca:
    name: SAST & dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      # Blocking: our own code must be clean.
      - name: Bandit (SAST)
        run: uv run bandit -r app -c pyproject.toml

      # Reporting (non-blocking): external advisories / broader rulesets.
      - name: pip-audit (dependency vulnerabilities)
        run: uv run pip-audit
        continue-on-error: true

      - name: Semgrep (SAST)
        run: uvx semgrep scan --config p/python --config p/security-audit --error
        continue-on-error: true
