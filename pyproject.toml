[project]
name = "barriapp-backend"
version = "0.1.0"
description = "BarriApp — delivery platform for neighborhood stores (backend API)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.49.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "beanie>=2.1",
    "redis>=5.2",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.5.0",
    "pwdlib[argon2]>=0.3.0",
    "email-validator>=2.2",
    "structlog>=24.4",
    "sentry-sdk[fastapi]>=2.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "testcontainers[mongodb,redis]>=4.8",
    "httpx-ws>=0.6",
    "pytest-timeout>=2.3",
    "bandit>=1.8",
    "bandit-sarif-formatter>=1.1.1",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ASYNC"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
# B101: asserts are used for type-narrowing (never for security checks).
skips = ["B101"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection markers are called in argument defaults by design.
extend-immutable-calls = [
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.Security",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 60
markers = [
    "req: link a test to one or more backlog story IDs (traceability), e.g. req('O-1')",
    "integration: tests that require Docker (testcontainers: MongoDB, Redis)",
]
